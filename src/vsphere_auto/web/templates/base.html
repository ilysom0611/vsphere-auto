<script>
// API-token support: when the server runs with VSPHERE_API_TOKEN set, every
// /api request must carry the token. Patch fetch ONCE here in <head>, before
// any page script runs: attach X-API-Token from localStorage and, on the first
// 401, ask for the token once and retry. No token configured server-side ->
// responses are 200 and this is a no-op.
(function () {
  var KEY = "vsphereApiToken";
  var orig = window.fetch.bind(window);
  window.fetch = function (input, init) {
    init = Object.assign({}, init || {});
    var url = typeof input === "string" ? input : (input && input.url) || "";
    if (url.indexOf("/api/") !== 0) return orig(input, init);
    var headers = new Headers(init.headers || {});
    var tok = localStorage.getItem(KEY);
    if (tok && !headers.has("X-API-Token")) headers.set("X-API-Token", tok);
    init.headers = headers;
    return orig(input, init).then(function (r) {
      if (r.status === 401 && !init.__tokenRetry) {
        var t = window.prompt("API token required (server VSPHERE_API_TOKEN):");
        if (t) {
          localStorage.setItem(KEY, t);
          init.__tokenRetry = true;
          headers.set("X-API-Token", t);
          return window.fetch(input, init);
        }
      }
      return r;
    });
  };
})();
</script>

(function () {
  var LANG_KEY = "vsphereLang";
  window.i18nLang = localStorage.getItem(LANG_KEY) ||
                    ((navigator.language || "").indexOf("en") === 0 ? "en" : "zh");
  window.t = function (key, params) {
    var d = window.I18N[window.i18nLang] || {};
    var s = d[key] !== undefined ? d[key] : (window.I18N.zh[key] !== undefined ? window.I18N.zh[key] : key);
    if (params) {
      Object.keys(params).forEach(function (k) {
        s = s.split("{" + k + "}").join(String(params[k]));
      });
    }
    return s;
  };
  window.applyI18n = function () {
    document.documentElement.lang = window.i18nLang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) {
      n.textContent = window.t(n.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function (n) {
      n.setAttribute("placeholder", window.t(n.getAttribute("data-i18n-ph")));
    });
    document.querySelectorAll("[data-i18n-title]").forEach(function (n) {
      n.setAttribute("title", window.t(n.getAttribute("data-i18n-title")));
    });
    var btn = document.getElementById("langToggle");
    if (btn) btn.textContent = window.t("lang.toggle");
  };
  // Toggle button lives in the nav; switching reloads so all dynamically
  // rendered content regenerates in the new language.
  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("langToggle");
    if (!btn) return;
    btn.onclick = function () {
      window.i18nLang = window.i18nLang === "zh" ? "en" : "zh";
      try { localStorage.setItem(LANG_KEY, window.i18nLang); } catch (e) {}
      location.reload();
    };
    window.applyI18n();
    // pages register extra dynamic-string refresh here if ever needed
    if (typeof window.onI18nReady === "function") window.onI18nReady();
  });
})();
</script>
