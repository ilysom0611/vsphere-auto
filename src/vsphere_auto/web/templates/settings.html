{% extends "base.html" %}
{% block title %}设置/凭据 - vSphere Auto{% endblock %}
{% block content %}
<h1>设置 / 凭据</h1>
<p class="muted">保存 vCenter / ESXi 的地址与账号，密码加密落盘（Fernet），可随时更新。部署时可直接引用。</p>

<section class="card">
  <h2>已保存凭据</h2>
  <table id="credsTable" class="table"><thead><tr><th>ID</th><th>名称</th><th>主机</th><th>用户</th><th>类型</th><th>更新</th><th>操作</th></tr></thead><tbody></tbody></table>
</section>

<section class="card">
  <h2 id="formTitle">新增凭据</h2>
  <div class="grid2">
    <label>名称 <input id="fName" placeholder="prod-vc"></label>
    <label>主机 <input id="fHost" placeholder="10.0.0.10"></label>
    <label>端口 <input id="fPort" value="443"></label>
    <label>类型 <select id="fType"><option value="vcenter">vcenter</option><option value="esxi">esxi</option></select></label>
    <label>用户名 <input id="fUser" placeholder="administrator@vsphere.local"></label>
    <label>密码 <input id="fPass" type="password" placeholder="留空表示不改（编辑时）"></label>
  </div>
  <div class="row">
    <button id="btnSave">保存</button>
    <button id="btnCancel" style="display:none">取消编辑</button>
    <span id="formMsg" class="muted"></span>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
let editingId=null;
async function load(){
  const r=await fetch('/api/creds'); const list=await r.json();
  const tb=document.querySelector('#credsTable tbody'); tb.innerHTML='';
  list.forEach(c=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${c.id}</td><td>${c.name}</td><td>${c.host}:${c.port}</td><td>${c.username}</td><td>${c.type}</td><td>${c.updated_at||''}</td>
    <td><button onclick="testCred(${c.id})">测试</button> <button onclick="editCred(${c.id},'${c.name}','${c.host}',${c.port},'${c.username}','${c.type}')">编辑</button> <button onclick="delCred(${c.id})">删除</button></td>`;
    tb.appendChild(tr);
  });
}
function editCred(id,name,host,port,user,type){
  editingId=id;
  document.getElementById('formTitle').textContent='编辑凭据 #'+id;
  document.getElementById('fName').value=name;
  document.getElementById('fHost').value=host;
  document.getElementById('fPort').value=port;
  document.getElementById('fUser').value=user;
  document.getElementById('fType').value=type;
  document.getElementById('fPass').value='';
  document.getElementById('btnCancel').style.display='';
}
document.getElementById('btnCancel').onclick=()=>{
  editingId=null;
  document.getElementById('formTitle').textContent='新增凭据';
  document.getElementById('fName').value=''; document.getElementById('fHost').value=''; document.getElementById('fPort').value='443'; document.getElementById('fUser').value=''; document.getElementById('fPass').value='';
  document.getElementById('btnCancel').style.display='none';
  document.getElementById('formMsg').textContent='';
};
async function testCred(id){
  const r=await fetch(`/api/creds/${id}/test`,{method:'POST'}); const j=await r.json();
  alert(JSON.stringify(j,null,2));
}
async function delCred(id){
  if(!confirm('删除凭据 #'+id+' ?')) return;
  await fetch(`/api/creds/${id}`,{method:'DELETE'});
  load();
}
document.getElementById('btnSave').onclick=async()=>{
  const body={name:document.getElementById('fName').value, host:document.getElementById('fHost').value, port:parseInt(document.getElementById('fPort').value,10)||443, username:document.getElementById('fUser').value, type:document.getElementById('fType').value};
  const pass=document.getElementById('fPass').value;
  if(pass) body.password=pass;
  else if(editingId===null) body.password='';
  // editing with empty password => omit (unchanged)
  if(editingId!==null && !pass) delete body.password;
  const url=editingId?`/api/creds/${editingId}`:'/api/creds';
  const method=editingId?'PUT':'POST';
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  document.getElementById('formMsg').textContent=r.ok?'已保存':'失败: '+(j.error||r.status);
  if(r.ok){ editingId=null; document.getElementById('formTitle').textContent='新增凭据'; document.getElementById('btnCancel').style.display='none'; document.getElementById('fPass').value=''; load(); }
};
load();
</script>
{% endblock %}
