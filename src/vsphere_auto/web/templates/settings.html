{% extends "base.html" %}
{% block title %}Settings / Credentials - vSphere Auto{% endblock %}
{% block content %}
<h1 data-i18n="set.h1">设置 / 凭据</h1>
<p class="muted" data-i18n="set.intro">保存 vCenter / ESXi 端点与账号。密码经 Fernet 加密后写入 <code>state/creds.db</code>，可随时更新；部署时按名称引用。</p>

<section class="card">
  <h2 data-i18n="set.saved.list">已保存的凭据</h2>
  <table id="credsTable" class="table"><thead><tr><th>ID</th><th data-i18n="set.col.name">名称</th><th data-i18n="set.col.host">主机</th><th data-i18n="set.col.user">用户</th><th data-i18n="set.col.type">类型</th><th data-i18n="set.col.updated">更新时间</th><th data-i18n="set.col.actions">操作</th></tr></thead><tbody></tbody></table>
</section>

<section class="card">
  <h2 id="formTitle" data-i18n="set.add">添加凭据</h2>
  <div class="grid2">
    <label><span data-i18n="set.name">名称</span> <input id="fName"></label>
    <label><span data-i18n="set.host">主机</span> <input id="fHost"></label>
    <label><span data-i18n="set.port">端口</span> <input id="fPort" value="443"></label>
    <label><span data-i18n="set.type">类型</span>
      <select id="fType"><option value="vcenter">vcenter</option><option value="esxi">esxi</option></select></label>
    <label><span data-i18n="set.user">用户名</span> <input id="fUser"></label>
    <label><span data-i18n="set.pass">密码</span> <input id="fPass" type="password"></label>
  </div>
  <div class="row">
    <button id="btnSave" data-i18n="set.save">保存</button>
    <button id="btnCancel" style="display:none" data-i18n="set.cancel">取消</button>
    <span id="formMsg" class="muted"></span>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
// All server-supplied values are rendered via textContent (never innerHTML
// interpolation) so credential names/hosts/usernames cannot inject markup.
let editingId=null;
function td(text){
  const c=document.createElement('td');
  c.textContent=(text===undefined||text===null)?'':String(text);
  return c;
}
function badge(kind, text){
  const b=document.createElement('span');
  b.className='badge '+kind;
  b.textContent=text;
  return b;
}
function applyPlaceholders(){
  // placeholders come from the i18n dictionary
  document.getElementById('fName').placeholder=t('set.name.ph');
  document.getElementById('fHost').placeholder=t('set.host.ph');
  document.getElementById('fUser').placeholder=t('set.user.ph');
  document.getElementById('fPass').placeholder=t('set.pass.ph');
}
async function load(){
  const r=await fetch('/api/creds'); const list=await r.json();
  const tb=document.querySelector('#credsTable tbody'); tb.innerHTML='';
  list.forEach(c=>{
    const tr=document.createElement('tr');
    tr.appendChild(td(c.id));
    tr.appendChild(td(c.name));
    tr.appendChild(td(c.host+':'+c.port));
    tr.appendChild(td(c.username));
    tr.appendChild(td(c.type));
    tr.appendChild(td(c.updated_at||''));
    const actions=document.createElement('td');
    const testBtn=document.createElement('button');
    testBtn.textContent=t('set.testbtn');
    testBtn.dataset.id=c.id; testBtn.dataset.action='test';
    actions.appendChild(testBtn);
    actions.appendChild(document.createTextNode(' '));
    const editBtn=document.createElement('button');
    editBtn.textContent=t('set.editbtn');
    editBtn.dataset.id=c.id; editBtn.dataset.action='edit';
    actions.appendChild(editBtn);
    actions.appendChild(document.createTextNode(' '));
    const delBtn=document.createElement('button');
    delBtn.textContent=t('set.delbtn');
    delBtn.dataset.id=c.id; delBtn.dataset.action='delete';
    actions.appendChild(delBtn);
    tr.appendChild(actions);
    tb.appendChild(tr);
  });
}
tbHandler();
function tbHandler(){
  document.querySelector('#credsTable tbody').addEventListener('click', async (ev)=>{
    const btn=ev.target.closest('button[data-action]');
    if(!btn) return;
    const id=parseInt(btn.dataset.id,10);
    if(btn.dataset.action==='test') await testCred(id);
    else if(btn.dataset.action==='edit') await editCred(id);
    else if(btn.dataset.action==='delete') await delCred(id);
  });
}
async function editCred(id){
  const r=await fetch('/api/creds/'+encodeURIComponent(id)); const c=await r.json();
  if(!r.ok||c.error){ alert(t('set.loadfail',{id:id})); return; }
  editingId=id;
  document.getElementById('formTitle').textContent=t('set.edit',{id:id});
  document.getElementById('fName').value=c.name;
  document.getElementById('fHost').value=c.host;
  document.getElementById('fPort').value=c.port;
  document.getElementById('fUser').value=c.username;
  document.getElementById('fType').value=c.type;
  document.getElementById('fPass').value='';
  document.getElementById('btnCancel').style.display='';
}
document.getElementById('btnCancel').onclick=()=>{
  editingId=null;
  document.getElementById('formTitle').textContent=t('set.add');
  document.getElementById('fName').value=''; document.getElementById('fHost').value=''; document.getElementById('fPort').value='443'; document.getElementById('fUser').value=''; document.getElementById('fPass').value='';
  document.getElementById('btnCancel').style.display='none';
  const msg=document.getElementById('formMsg'); msg.textContent=''; msg.className='muted';
};
async function testCred(id){
  // Inline colored result next to the tested row's button.
  document.querySelectorAll('.testResult').forEach(n=>n.remove());
  const btn=document.querySelector(`button[data-action="test"][data-id="${id}"]`);
  if(btn) btn.disabled=true;
  try{
    const r=await fetch(`/api/creds/${id}/test`,{method:'POST'}); const j=await r.json();
    const span=document.createElement('span');
    span.className='testResult';
    if(r.ok && j.ok){
      span.appendChild(badge('ok',t('set.test.ok')));
      const s=j.summary||{};
      const bits=[];
      if(j.version) bits.push('vSphere '+j.version);
      if(s.datacenters!==undefined) bits.push(t('set.dc')+' '+s.datacenters);
      if(s.hosts!==undefined) bits.push(t('set.hosts')+' '+s.hosts);
      if(bits.length) span.appendChild(document.createTextNode(' '+bits.join(' · ')));
      if(j.warning){ span.appendChild(document.createTextNode(' ')); span.appendChild(badge('warn',j.warning)); }
    } else {
      span.appendChild(badge('err',t('set.test.fail')));
      if(j.error) span.appendChild(document.createTextNode(' '+j.error));
    }
    if(btn&&btn.parentElement) btn.parentElement.appendChild(span);
  } finally {
    if(btn) btn.disabled=false;
  }
}
async function delCred(id){
  if(!confirm(t('set.delconfirm',{id:id}))) return;
  await fetch(`/api/creds/${id}`,{method:'DELETE'});
  load();
}
document.getElementById('btnSave').onclick=async()=>{
  const body={name:document.getElementById('fName').value, host:document.getElementById('fHost').value, port:parseInt(document.getElementById('fPort').value,10)||443, username:document.getElementById('fUser').value, type:document.getElementById('fType').value};
  const pass=document.getElementById('fPass').value;
  if(pass) body.password=pass;
  else if(editingId===null) body.password='';
  if(editingId!==null && !pass) delete body.password;
  const url=editingId?`/api/creds/${editingId}`:'/api/creds';
  const method=editingId?'PUT':'POST';
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  const msg=document.getElementById('formMsg');
  msg.className=r.ok?'msg-ok':'msg-err';
  msg.textContent=r.ok?t('set.saved.msg'):(t('set.savefail')+(j.error||r.status));
  if(r.ok){ editingId=null; document.getElementById('formTitle').textContent=t('set.add'); document.getElementById('btnCancel').style.display='none'; document.getElementById('fPass').value=''; load(); }
};
load();
applyPlaceholders();
</script>
{% endblock %}
