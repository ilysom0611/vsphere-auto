# vSphere Auto — example config
# Fill host OR credsRef (saved credential name). Leave auto fields empty to auto-select.

vcenter:
  # Option A: reference saved credential
  # credsRef: prod-vc
  # Option B: direct connection
  host: 10.0.0.10
  port: 443
  user: administrator@vsphere.local
  # password via VSPHERE_PASSWORD env or --password-file, not here
  datacenter: DC1
  # cluster: auto
  # datastore: auto
  # network: auto

defaults:
  folder: workloads/demo
  guestId: ubuntu64Guest
  # template: tpl-ubuntu22-04   # used when generating VMs from top-level `count`

# Reserved for future use — currently NOT consumed by any code path:
#   defaults.firmware, defaults.hardwareVersion, defaults.resourcePool,
#   ipPool.poolsFile, vms[].extraConfig
# They are still accepted by the config model but silently ignored.

batch:
  concurrency: 5
  onError: continue       # continue | fail-fast
  naming: "demo-{index:02d}"

# Count-based expansion: instead of listing vms[], set count + template and
# `count` VMs are generated named via batch.naming (must contain {index}):
# count: 3
# template: tpl-ubuntu22-04

ipPool:
  cidr: 10.10.20.0/24
  gateway: 10.10.20.1
  netmask: 255.255.255.0
  dns: [10.10.20.2, 8.8.8.8]

vms:
  - name: demo-01
    template: tpl-ubuntu22-04   # template OR iso (mutually exclusive)
    cpu: 4
    memoryMB: 8192
    diskGB: 80
    guestId: ubuntu64Guest
    networks:
      - network: auto
        ip: auto                # auto | dhcp | 10.10.20.11
  # - name: demo-02
  #   iso: "[datastore1] iso/ubuntu-22.04.iso"
  #   cpu: 2
  #   memoryMB: 4096
  #   diskGB: 40
