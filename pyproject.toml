[project]
name = "vsphere-auto"
version = "0.1.0"
description = "vSphere automated batch VM deployment with auto resource selection, idempotency and robustness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "pyvmomi>=7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "cryptography>=42.0",
    "tenacity>=8.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.scripts]
vsphere-auto = "vsphere_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsphere_auto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
